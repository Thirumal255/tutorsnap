name: Test Suite

# ─── Triggers ──────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/test.yml'

  workflow_dispatch:                   # manual on-demand run

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest – TutorSnap
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── 2. Python ─────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt

      # ── 3. Install deps ────────────────────────────────────────────────────
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      # ── 4. Run tests ───────────────────────────────────────────────────────
      - name: Run tests
        id: pytest
        continue-on-error: true        # let report + notify steps always run
        env:
          DATABASE_URL:      "sqlite:///:memory:"
          JWT_SECRET:        "ci-test-secret-key-at-least-32-chars-long"
          JWT_EXPIRY_HOURS:  "24"
          GOOGLE_CLIENT_ID:  "ci-test-google-client-id"
          ANTHROPIC_API_KEY: "ci-test-anthropic-key"
          ADMIN_EMAILS:      "admin@test.com"
          USE_GCS:           "false"
          UPLOAD_DIR:        "uploads_test"
        run: |
          pytest \
            --tb=short \
            --no-header \
            -rN \
            --cov=. \
            --cov-config=.coveragerc \
            --cov-report=term-missing \
            --cov-report=html:htmlcov \
            --json-report \
            --json-report-file=report.json \
            -v \
            2>&1 | tee pytest_output.txt
          exit ${PIPESTATUS[0]}

      # ── 5. Parse report ────────────────────────────────────────────────────
      - name: Parse test report
        id: report
        if: always()
        shell: python
        run: |
          import json, os, sys

          OUT = os.environ["GITHUB_OUTPUT"]

          try:
              data = json.load(open("report.json"))
          except Exception as e:
              print(f"Could not read report.json: {e}", file=sys.stderr)
              open(OUT, "a").write(
                  "passed=0\nfailed=0\nerrors=0\ntotal=0\nstatus=error\n"
                  "summary=Report not generated — check logs.\n"
              )
              sys.exit(0)

          s       = data.get("summary", {})
          passed  = s.get("passed", 0)
          failed  = s.get("failed", 0)
          errors  = s.get("error",  0)
          total   = s.get("total",  0)
          dur     = round(data.get("duration", 0), 1)
          ok      = (failed + errors) == 0
          status  = "passed" if ok else "failed"

          lines = [
              ("PASSED" if ok else "FAILED") + " — TutorSnap Test Report",
              f"Branch : ${{ github.ref_name }}  |  Commit: ${{ github.sha }}"[:60],
              f"Results: {passed}/{total} passed  |  {failed} failed  |  {errors} errors  |  {dur}s",
          ]

          if not ok:
              lines.append("")
              lines.append("Failed tests:")
              for t in data.get("tests", []):
                  if t.get("outcome") not in ("passed", "skipped"):
                      lines.append(f"  FAIL  {t['nodeid']}")
                      longrepr = (t.get("call") or {}).get("longrepr", "")
                      for ln in longrepr.splitlines()[:3]:
                          lines.append(f"        {ln}")

          # Append coverage total
          try:
              for ln in open("pytest_output.txt").readlines():
                  if ln.strip().startswith("TOTAL"):
                      lines.append(f"Coverage: {ln.strip()}")
                      break
          except Exception:
              pass

          summary = "\n".join(lines)
          print(summary)

          with open(OUT, "a") as f:
              f.write(f"passed={passed}\n")
              f.write(f"failed={failed}\n")
              f.write(f"errors={errors}\n")
              f.write(f"total={total}\n")
              f.write(f"status={status}\n")
              f.write(f"summary<<__SUMMARY__\n{summary}\n__SUMMARY__\n")

      # ── 6. GitHub Step Summary ─────────────────────────────────────────────
      - name: Post Step Summary
        if: always()
        shell: python
        run: |
          import json, os, collections

          SUMMARY = os.environ["GITHUB_STEP_SUMMARY"]

          try:
              data   = json.load(open("report.json"))
              tests  = data.get("tests", [])
              reg    = json.load(open("tests/registry.json"))
              # Build lookup: nodeid fragment -> registry entry
              reg_map = {}
              for entry in reg.get("tests", []):
                  key = f"{entry['file']}::{entry.get('class','')}::{entry['function']}"
                  reg_map[key] = entry
          except Exception:
              tests = []
              reg_map = {}

          s        = data.get("summary", {}) if tests else {}
          passed   = s.get("passed", 0)
          failed   = s.get("failed", 0)
          errors   = s.get("error",  0)
          total    = s.get("total",  0)
          duration = round(data.get("duration", 0), 1) if tests else 0

          # Group tests by marker (feature area) using registry
          by_marker = collections.defaultdict(list)
          for t in tests:
              nid     = t.get("nodeid", "")
              outcome = t.get("outcome", "unknown")
              # Try to find registry entry by matching file + class + function
              parts   = nid.replace("::", "/", 1).split("::")
              fname   = parts[0].split("/")[-1] if parts else ""
              cls     = parts[1] if len(parts) > 2 else ""
              fn      = parts[-1] if parts else ""
              reg_key = f"{fname}::{cls}::{fn}"
              entry   = reg_map.get(reg_key, {})
              marker  = entry.get("marker", "other")
              name    = entry.get("name", fn)
              by_marker[marker].append((name, outcome, nid))

          MARKER_LABEL = {
              "auth": "🔐 Auth", "admin": "🛠 Admin", "student": "🎓 Student",
              "session": "💬 Session", "study": "📖 Study Mode",
              "exam": "📝 Exam / Flashcard", "books": "📚 Books",
              "gamification": "🏆 Gamification", "parent": "👨‍👩‍👧 Parent",
              "other": "🔧 Other",
          }

          icon  = "✅" if (failed + errors) == 0 else "❌"
          lines = []
          lines.append(f"## {icon} TutorSnap Test Results\n")
          lines.append(f"| Passed | Failed | Errors | Total | Duration |")
          lines.append(f"|--------|--------|--------|-------|----------|")
          lines.append(f"| {passed} | {failed} | {errors} | {total} | {duration}s |\n")

          if by_marker:
              lines.append("### Test Cases by Feature\n")
              for marker in sorted(by_marker.keys()):
                  group    = by_marker[marker]
                  label    = MARKER_LABEL.get(marker, marker)
                  gpass    = sum(1 for _, o, _ in group if o == "passed")
                  gfail    = sum(1 for _, o, _ in group if o not in ("passed","skipped"))
                  hdr_icon = "✅" if gfail == 0 else "❌"
                  lines.append(f"<details><summary>{hdr_icon} {label} &nbsp;—&nbsp; {gpass}/{len(group)} passed</summary>\n")
                  lines.append("| Result | Test |")
                  lines.append("|--------|------|")
                  for name, outcome, nid in sorted(group, key=lambda x: x[0]):
                      row_icon = "✅" if outcome == "passed" else ("⏭" if outcome == "skipped" else "❌")
                      lines.append(f"| {row_icon} | {name} |")
                  lines.append("\n</details>\n")

          open(SUMMARY, "a").write("\n".join(lines) + "\n")

      # ── 7. Upload artifacts ────────────────────────────────────────────────
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: backend/htmlcov/
          retention-days: 14

      - name: Upload test JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-json
          path: backend/report.json
          retention-days: 14

      # ── 8. Build coverage summary ──────────────────────────────────────────
      - name: Build coverage summary
        id: cov
        if: always()
        shell: python
        run: |
          import os, re

          OUT = os.environ["GITHUB_OUTPUT"]

          try:
              raw = open("pytest_output.txt").read()
          except Exception:
              raw = ""

          # Extract every coverage line: "filename   stmts   miss   cover%"
          pattern = re.compile(r'^(\S+)\s+(\d+)\s+(\d+)\s+(\d+%)', re.MULTILINE)
          rows = pattern.findall(raw)

          total_pct = "n/a"
          for name, stmts, miss, pct in rows:
              if name == "TOTAL":
                  total_pct = pct
                  break

          # Files with lowest coverage (exclude TOTAL, tests/, __init__)
          modules = [
              (name, int(stmts), int(miss), pct)
              for name, stmts, miss, pct in rows
              if name != "TOTAL"
              and not name.startswith("tests")
              and "__init__" not in name
              and int(stmts) > 5
          ]
          modules.sort(key=lambda x: int(x[2]), reverse=True)   # most missed first
          low5 = modules[:5]

          lines = [f"Coverage: {total_pct}"]
          if low5:
              lines.append("Needs attention:")
              for name, stmts, miss, pct in low5:
                  short = name.replace(".py", "")
                  lines.append(f"  {short}: {pct} ({miss} lines uncovered)")

          summary = "\n".join(lines)
          print(summary)

          with open(OUT, "a") as f:
              f.write(f"total_pct={total_pct}\n")
              f.write(f"summary<<__COV__\n{summary}\n__COV__\n")

      # ── 9. Telegram — text notification (only on failure) ─────────────────
      - name: Send Telegram notification
        if: steps.report.outputs.status != 'passed'
        continue-on-error: true
        shell: bash
        env:
          BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS:      ${{ steps.report.outputs.status }}
          PASSED:      ${{ steps.report.outputs.passed }}
          FAILED:      ${{ steps.report.outputs.failed }}
          ERRORS:      ${{ steps.report.outputs.errors }}
          TOTAL:       ${{ steps.report.outputs.total }}
          COV_SUMMARY: ${{ steps.cov.outputs.summary }}
          RUN_URL:     ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH:      ${{ github.ref_name }}
          SHA:         ${{ github.sha }}
          ACTOR:       ${{ github.actor }}
        run: |
          ICON="❌ FAILED"
          [ "$STATUS" = "passed" ] && ICON="✅ PASSED"

          TEXT=$(printf '%s — TutorSnap Tests\nResults: %s/%s passed · %s failed · %s errors\nBranch : %s (%s)  |  Actor: %s\n\n%s\n\n%s' \
            "$ICON" "$PASSED" "$TOTAL" "$FAILED" "$ERRORS" \
            "$BRANCH" "${SHA:0:7}" "$ACTOR" \
            "$COV_SUMMARY" "$RUN_URL")

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            > /dev/null

      # ── 10. Telegram — send coverage HTML as downloadable zip (only on failure) ──
      - name: Send coverage report to Telegram
        if: steps.report.outputs.status != 'passed'
        continue-on-error: true
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          SHA:       ${{ github.sha }}
          TOTAL_PCT: ${{ steps.cov.outputs.total_pct }}
        run: |
          if [ -d "htmlcov" ]; then
            ZIP="coverage-${SHA:0:7}.zip"
            zip -r "$ZIP" htmlcov/ -x "*.pyc" > /dev/null
            CAPTION="📊 Coverage Report — ${TOTAL_PCT} overall (${SHA:0:7})"
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
              -F "chat_id=${CHAT_ID}" \
              -F "document=@${ZIP}" \
              -F "caption=${CAPTION}" \
              > /dev/null
          else
            echo "htmlcov/ not found — skipping coverage zip"
          fi

      # ── 9. Fail job if tests failed ────────────────────────────────────────
      - name: Fail if tests failed
        if: steps.report.outputs.status == 'failed' || steps.report.outputs.status == 'error'
        run: |
          echo "❌ ${{ steps.report.outputs.failed }} test(s) failed."
          exit 1
