name: Build Polyhouse Tracker APK

on:
  push:
    branches: [main]
    paths:
      - 'tasks-app/**'
      - '.github/workflows/build-tasks-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: tasks-app/package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: tasks-app
        run: npm ci

      - name: Build web app
        working-directory: tasks-app
        env:
          VITE_API_BASE: ${{ secrets.TASKS_APP_API_BASE }}
          VITE_MOBILE_API_KEY: ${{ secrets.MOBILE_API_KEY }}
        run: npm run build

      - name: Sync Capacitor
        working-directory: tasks-app
        run: npx cap sync android

      - name: Write local.properties with CI SDK path
        run: echo "sdk.dir=$ANDROID_HOME" > tasks-app/android/local.properties

      - name: Make Gradle executable
        working-directory: tasks-app/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: tasks-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mv tasks-app/android/app/build/outputs/apk/debug/app-debug.apk \
             tasks-app/android/app/build/outputs/apk/debug/PolyhouseTracker.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PolyhouseTracker-${{ github.sha }}
          path: tasks-app/android/app/build/outputs/apk/debug/PolyhouseTracker.apk
          retention-days: 30

      - name: Print APK location
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            core.notice(`APK built. Download from: ${runUrl}`)
