# Deploy Tasks App — last updated 2026-06-01
name: Deploy Tasks App

on:
  push:
    branches: [main]
    paths:
      - 'tasks-app/**'
      - '.github/workflows/deploy-tasks-app.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tasks-app/package-lock.json

      - name: Install dependencies
        working-directory: tasks-app
        run: npm ci

      - name: Build
        working-directory: tasks-app
        env:
          VITE_API_BASE: ${{ secrets.TASKS_APP_API_BASE }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID_WEB }}
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TASKS }}
          projectId: tutorsnap-tasks
          channelId: live
          entryPoint: tasks-app

      - name: Print deployed URL
        run: |
          echo "## 🚀 Tasks App Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: https://tutorsnap-tasks.web.app" >> "$GITHUB_STEP_SUMMARY"
