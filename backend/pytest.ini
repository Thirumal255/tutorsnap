[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

# Feature markers — used to run targeted tests for a specific push
markers =
    auth: Authentication and JWT tests
    admin: Admin management endpoints
    student: Student-facing features (dashboard, progress, buddy)
    session: Practice session flow (start, answer, hints, end)
    study: Study Mode (explain, chat, quick-check, unlock)
    exam: Exam and Flashcard modes
    parent: Parent portal features
    books: Book ingestion and topic listing
    gamification: XP, streaks, achievements, leaderboard
    regression: Full regression suite (all features)
    migration: Schema integrity — Alembic migration vs models drift detection
